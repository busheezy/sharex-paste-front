<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="darkreader-lock" />
    <meta name="theme-color" content="#111217" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <script nonce="%sveltekit.nonce%">
      try {
        const storedTheme = localStorage.getItem("paste:theme");
        const validTheme = storedTheme === "light" || storedTheme === "dark";
        const preferredTheme = matchMedia("(prefers-color-scheme: light)").matches
          ? "light"
          : "dark";
        const theme = validTheme ? storedTheme : preferredTheme;
        document.documentElement.dataset.theme = theme;
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
