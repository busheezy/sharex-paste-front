<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="A text and code viewer." />
    <meta name="theme-color" content="#111217" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Paste</title>
  </head>
  <body>
    <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <symbol id="icon-copy" viewBox="0 0 24 24">
        <rect x="8" y="8" width="12" height="12" rx="2" />
        <path d="M16 8V4H4v12h4" />
      </symbol>
      <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="6.5" />
        <path d="m16 16 5 5" />
      </symbol>
      <symbol id="icon-link" viewBox="0 0 24 24">
        <path
          d="m10 13 4-4M8 15l-2 2a4 4 0 0 1-5-5l5-5a4 4 0 0 1 6 0m0 2 2-2a4 4 0 0 1 6 5l-5 5a4 4 0 0 1-6 0"
          transform="translate(1 0)"
        />
      </symbol>
      <symbol id="icon-download" viewBox="0 0 24 24">
        <path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5" />
      </symbol>
      <symbol id="icon-expand" viewBox="0 0 24 24">
        <path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6" />
      </symbol>
      <symbol id="icon-theme" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8" />
        <path d="M12 4v16" />
      </symbol>
      <symbol id="icon-wrap" viewBox="0 0 24 24">
        <path d="M3 5h18M3 10h14a4 4 0 0 1 0 8h-6m3-3-3 3 3 3M3 16h4" />
      </symbol>
    </svg>
    <main id="app">
      <section id="home" class="home" hidden>
        <a href="https://github.com/busheezy/sharex-paste-front">View project on GitHub</a>
      </section>
      <section id="viewer" hidden aria-label="Paste viewer">
        <div class="reading-layout">
          <section id="editor" class="editor" aria-label="Reading workspace">
            <div class="editor-toolbar">
              <label class="language-control"
                ><span class="language-dot"></span><span class="sr-only">Syntax language</span
                ><select id="language" disabled>
                  <option value="text">Plain text</option>
                </select></label
              >
              <div class="editor-controls">
                <button
                  id="searchBtn"
                  class="icon-button"
                  disabled
                  aria-label="Find in paste"
                  title="Find in paste (Ctrl/⌘ F)"
                >
                  <svg><use href="#icon-search" /></svg>
                </button>

                <button
                  id="wrapBtn"
                  class="icon-button"
                  aria-label="Wrap long lines"
                  aria-pressed="false"
                  title="Wrap long lines (W)"
                >
                  <svg><use href="#icon-wrap" /></svg>
                </button>
                <button
                  id="linesBtn"
                  class="icon-button"
                  aria-label="Show line numbers"
                  aria-pressed="true"
                  title="Line numbers"
                >
                  #
                </button>
                <button
                  id="fullscreenBtn"
                  class="icon-button"
                  aria-label="Enter fullscreen"
                  title="Fullscreen (F)"
                >
                  <svg><use href="#icon-expand" /></svg>
                </button>
                <button
                  id="copyBtn"
                  class="icon-button"
                  disabled
                  aria-label="Copy text"
                  title="Copy text (C)"
                >
                  <svg><use href="#icon-copy" /></svg>
                </button>
                <button
                  id="shareBtn"
                  class="icon-button"
                  disabled
                  aria-label="Copy link"
                  title="Copy link"
                >
                  <svg><use href="#icon-link" /></svg>
                </button>
                <button
                  id="downloadBtn"
                  class="icon-button"
                  disabled
                  aria-label="Download text"
                  title="Download text"
                >
                  <svg><use href="#icon-download" /></svg>
                </button>
                <a
                  id="rawAnchor"
                  class="icon-button"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="View raw"
                  title="View raw"
                  hidden
                  >{ }</a
                >
                <label class="font-control" title="Text size"
                  ><span class="sr-only">Text size</span
                  ><input id="fontSize" type="range" min="12" max="22" step="1" value="14" /><output
                    id="fontValue"
                    >14px</output
                  ></label
                >
                <button
                  id="themeBtn"
                  class="icon-button"
                  aria-label="Switch color theme"
                  title="Switch color theme"
                >
                  <svg><use href="#icon-theme" /></svg>
                </button>
                <button
                  id="helpBtn"
                  class="icon-button"
                  aria-label="Keyboard shortcuts"
                  title="Keyboard shortcuts (?)"
                >
                  ?
                </button>
              </div>
            </div>
            <form id="searchBar" class="search-bar" hidden role="search">
              <svg><use href="#icon-search" /></svg
              ><label class="sr-only" for="searchInput">Find text in paste</label
              ><input
                id="searchInput"
                type="search"
                placeholder="Find in paste…"
                autocomplete="off"
                spellcheck="false"
              /><output id="searchCount" aria-live="polite">0 matches</output
              ><button
                id="previousMatch"
                class="icon-button"
                type="button"
                aria-label="Previous match"
              >
                ↑</button
              ><button class="icon-button" type="submit" aria-label="Next match">↓</button
              ><button id="closeSearch" class="icon-button" type="button" aria-label="Close search">
                ×
              </button>
            </form>
            <div id="loading" class="loading">
              <div></div>
              <div></div>
              <div></div>
              <div></div>
              <span class="sr-only">Loading paste</span>
            </div>
            <div id="errorPanel" class="error-panel" hidden>
              <span class="error-symbol" aria-hidden="true">!</span>
              <h2 id="errorTitle">Unable to load paste</h2>
              <p id="errorMessage"></p>
              <button id="retryBtn" class="button">Try again</button
              ><a class="text-link" href="/">Back to home</a>
            </div>
            <div
              id="content"
              tabindex="0"
              role="region"
              aria-label="Paste content"
              aria-busy="true"
            ></div>
            <p id="renderStatus" class="render-status" role="status"></p>
          </section>
        </div>
      </section>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <dialog id="shortcutsDialog" aria-labelledby="shortcutsTitle">
      <form method="dialog">
        <button class="icon-button dialog-close" aria-label="Close keyboard shortcuts">×</button>
      </form>
      <h2 id="shortcutsTitle">Keyboard shortcuts</h2>
      <dl class="shortcuts">
        <div>
          <dt>Find in paste</dt>
          <dd><kbd>Ctrl / ⌘</kbd> <kbd>F</kbd></dd>
        </div>
        <div>
          <dt>Copy text</dt>
          <dd><kbd>C</kbd></dd>
        </div>
        <div>
          <dt>Toggle line wrapping</dt>
          <dd><kbd>W</kbd></dd>
        </div>
        <div>
          <dt>Fullscreen</dt>
          <dd><kbd>F</kbd></dd>
        </div>
        <div>
          <dt>Next / previous match</dt>
          <dd><kbd>Enter</kbd> / <kbd>Shift Enter</kbd></dd>
        </div>
        <div>
          <dt>Close search or dialog</dt>
          <dd><kbd>Esc</kbd></dd>
        </div>
      </dl>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
